name: Build

on:
  push:
    tags: ["*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read  # for checkout
    outputs:
      name: ${{ steps.baipp.outputs.package_name }}
      version: ${{ steps.baipp.outputs.package_version }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: hynek/build-and-inspect-python-package@v3.0.2
      id: baipp

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.name }}/${{ needs.build.outputs.version }}
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
    - uses: actions/download-artifact@v8.0.2
      with:
        name: Packages
        path: dist
    - uses: pypa/gh-action-pypi-publish@v1.14.3
