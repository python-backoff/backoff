[project]
site_url = "https://backoff.readthedocs.io/"
site_description = "Python library providing function decorators for configurable backoff and retry"
site_name = "backoff"
repo_url = "https://github.com/python-backoff/backoff"
repo_name = "python-backoff/backoff"
nav = [
    { Home = "index.md" },
    { "Getting Started" = "getting-started.md" },
    { "User Guide" = [
        { "Decorators" = "user-guide/decorators.md" },
        { "Context Manager" = "user-guide/context-manager.md" },
        { "Wait Strategies" = "user-guide/wait-strategies.md" },
        { "Configuration" = "user-guide/configuration.md" },
        { "Event Handlers" = "user-guide/event-handlers.md" },
        { "Logging" = "user-guide/logging.md" },
        { "Async Support" = "user-guide/async.md" },
    ] },
    { "Advanced" = [
        { "Combining Decorators" = "advanced/combining-decorators.md" },
        { "Runtime Configuration" = "advanced/runtime-config.md" },
        { "Custom Strategies" = "advanced/custom-strategies.md" },
    ] },
    { "Examples" = "examples.md" },
    { "API Reference" = "api/backoff/index.md" },
    { "FAQ" = "faq.md" },
    { "Changelog" = "changelog.md" },
]

[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.highlight]
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]

[project.plugins.llmstxt]
base_url = "https://backoff.readthedocs.io/en/latest"
full_output = "llms-full.txt"
markdown_description = """
This library provides function decorators which can be \
used to wrap a function such that it will be retried \
until some condition is met. It is meant to be of use \
when accessing unreliable resources with the potential \
for intermittent failures i.e. network resources and \
external APIs. Somewhat more generally, it may also be \
of use for dynamically polling resources for externally \
generated content.

Decorators support both regular functions for synchronous \
code and `asyncio` coroutines for asynchronous code.

Context managers are also available to enable retries of \
arbitrary code blocks.
"""

[project.plugins.llmstxt.sections]
"Usage documentation" = [
    { "getting-started.md" = "Getting Started" },
    "user-guide/*.md"
]
"API reference" = ["api/backoff/index.md"]

[project.plugins.mkdocs-autoapi]
autoapi_add_nav_entry = false
autoapi_dir = "./backoff"
autoapi_file_patterns = [
    "__init__.py"
]
autoapi_keep_files = true
autoapi_root = "api"

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
separate_signature = true
show_source = true

[project.plugins.offline]
enabled = true

[project.plugins.redirects.redirect_maps]
"api/reference.md" = "api/backoff/index.md"

[project.theme]
name = "material"
features = [
    "content.code.copy",
    "content.code.select",
    "content.code.annotate",
    "navigation.indexes",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "search.highlight",
    "search.share",
    "search.suggest",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"
